  <!-- IF Label -->
  <text x="40" y="44" font-family="'Fredoka', 'Nunito', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">if</text>

  <!-- Hexagon Condition: path ahead? -->
  <polygon points="72,36 86,18 240,18 254,36 240,54 86,54" fill="#59C059" stroke="#389438" stroke-width="2"/>
  <text x="96" y="42" font-family="'Fredoka', 'Nunito', 'Segoe UI', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">path ahead ?</text>
  
  <!-- THEN Label -->
  <text x="268" y="44" font-family="'Fredoka', 'Nunito', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">then</text>

  <!-- Walk Block -->
  <rect x="42" y="74" width="280" height="42" rx="8" fill="#4C97FF" stroke="#3373CC" stroke-width="1.5"/>
  <text x="56" y="101" font-family="'Fredoka', 'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">walk</text>
  <rect x="104" y="80" width="38" height="28" rx="14" fill="#FFFFFF"/>

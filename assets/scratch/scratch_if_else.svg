           L 30,116 C 30,122 34,126 40,126 
           L 44,126 C 48,126 50,130 54,130 L 70,130 C 74,130 76,126 80,126 
           L 360,126 C 366,126 370,130 370,136 
           L 370,158 C 370,164 366,168 360,168 
           L 80,168 C 76,168 74,172 70,172 L 54,172 C 50,172 48,168 44,168 
           L 40,168 C 34,168 30,172 30,178 
           L 30,212 C 30,218 34,222 40,222 
